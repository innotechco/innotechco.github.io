# What serves the built site inside the container.
#
# It sits behind Caddy, which holds the certificate and the domain name. This
# file is only concerned with handing out files correctly.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression, because the ceiling in vite.config.js is about COMPRESSED
    # bytes on the wire. Serving these uncompressed would put every chunk back
    # over the size that was measured not arriving.
    #
    # gzip only: stock nginx has no brotli module. The chunks are built to fit
    # under the ceiling in brotli, and gzip of the same chunk is larger - which
    # is accounted for in that file's own note, and is why the ceiling is not
    # set higher. A CDN in front that speaks brotli improves on this.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Vite puts a content hash in every asset filename, so a given URL's
    # contents can never change. Caching it for a year is safe by construction,
    # and it is what keeps a repeat visit from re-fetching the chunks the whole
    # of vite.config.js is written around.
    # One header, not two: `expires 1y` emits its own Cache-Control, and with
    # an add_header beside it nginx sends both. Browsers pick one and the
    # response is merely untidy, but a cache in between need not agree with
    # them about which.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html is the opposite case: it is the document that names the
    # current hashed filenames. Cached, a visitor keeps asking for the assets
    # of a deploy that no longer exists and the site breaks for them alone,
    # invisibly, until they clear it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sitemap.xml { add_header Cache-Control "no-cache"; }
    location = /robots.txt  { add_header Cache-Control "no-cache"; }

    # The SPA fallback, and the real difference between this and GitHub Pages.
    #
    # The router draws /articles/:slug and /inlearn/courses/:slug in the
    # browser; on static hosting an address with no file behind it is a 404,
    # which is why the build runs generate-static-route-fallbacks.mjs. Here
    # nginx can answer any address with index.html and let the router work it
    # out, so a new course is reachable the moment Strapi has it - no deploy,
    # no generator run.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nothing here is secret, but there is no reason to announce the version.
    server_tokens off;
}
