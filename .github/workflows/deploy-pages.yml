name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  check-wordpress-routes:
    runs-on: ubuntu-latest
    outputs:
      deploy-needed: ${{ steps.check.outputs.deploy-needed }}
    steps:
      - name: Check for new WordPress article routes
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          CMS_BASE_URL: "https://blog.innotech.global"
          SITE_BASE_URL: "https://innotech.global"
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "deploy-needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node --input-type=module <<'EOF'
          import fs from "node:fs";

          const postsUrl = new URL("/wp-json/wp/v2/posts", `${process.env.CMS_BASE_URL}/`);
          postsUrl.searchParams.set("per_page", "50");
          postsUrl.searchParams.set("_fields", "slug");
          const postsResponse = await fetch(postsUrl);
          if (!postsResponse.ok) throw new Error(`WordPress request failed: ${postsResponse.status}`);

          const posts = await postsResponse.json();
          let deployNeeded = false;
          for (const {slug} of posts) {
            const articleUrl = new URL(`/articles/${slug}/`, `${process.env.SITE_BASE_URL}/`);
            const response = await fetch(articleUrl, {redirect: "manual"});
            if (response.status !== 200) {
              deployNeeded = true;
              console.log(`Missing article route: ${articleUrl} (${response.status})`);
              break;
            }
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `deploy-needed=${deployNeeded}\n`);
          EOF

  build:
    needs: check-wordpress-routes
    if: needs.check-wordpress-routes.outputs.deploy-needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Organization/user sites are served from /; project sites are served
          # from /repository-name/. This also keeps forks and the personal Pages
          # deployment working independently.
          VITE_BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}
          VITE_CMS_ENABLED: "true"
          VITE_CMS_BASE_URL: "https://blog.innotech.global"
          VITE_CMS_HOME_ENABLED: "false"
          VITE_CMS_BLOG_ENABLED: "true"
          VITE_CMS_BLOG_PER_PAGE: "50"
        run: npm run build

      - name: Add SPA fallback
        # Keeps the old cp dist/index.html dist/404.html fallback behavior,
        # and also creates 200-status static entries for known SPA routes.
        env:
          VITE_CMS_ENABLED: "true"
          VITE_CMS_BASE_URL: "https://blog.innotech.global"
          VITE_CMS_BLOG_ENABLED: "true"
          VITE_CMS_BLOG_PER_PAGE: "50"
        run: node scripts/generate-static-route-fallbacks.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site automatically when it has not been enabled yet.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
