name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Hourly is enough to pick up new WordPress articles; every run costs a
    # WordPress fetch plus one request per post back to the live site.
    - cron: "0 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  check-new-routes:
    runs-on: ubuntu-latest
    outputs:
      deploy-needed: ${{ steps.check.outputs.deploy-needed }}
    steps:
      # Both of the places content is written from, because both of them mint
      # addresses this site has to have a real file for.
      #
      # An article and a course are the same shape of problem: somebody adds
      # one in an admin panel, it shows up in its list straight away because
      # the page asks at runtime, and then the link to it 404s - on static
      # hosting an address with no file is not an address. The generator
      # writes those files, and the generator only runs on a deploy.
      #
      # Courses were left out of this check, so a new one waited for somebody
      # to publish an article or push a commit before it could be linked to.
      - name: Check for new article or course routes
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          CMS_BASE_URL: "https://blog.innotech.global"
          SITE_BASE_URL: "https://innotech.global"
          INLEARN_API_URL: ${{ vars.INLEARN_API_URL }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "deploy-needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node --input-type=module <<'EOF'
          import fs from "node:fs";

          const site = `${process.env.SITE_BASE_URL}/`;

          /* Whether the live site already serves this address. A redirect is
             not a page, so "manual" keeps one from being followed into a 200. */
          async function isMissing(routePath) {
            const url = new URL(routePath, site);
            const response = await fetch(url, {redirect: "manual"});
            if (response.status === 200) return false;
            console.log(`Missing route: ${url} (${response.status})`);
            return true;
          }

          async function articlePaths() {
            const url = new URL("/wp-json/wp/v2/posts", `${process.env.CMS_BASE_URL}/`);
            url.searchParams.set("per_page", "50");
            url.searchParams.set("_fields", "slug");

            const response = await fetch(url);
            if (!response.ok) throw new Error(`WordPress request failed: ${response.status}`);

            return (await response.json()).map(({slug}) => `/articles/${slug}/`);
          }

          /* Empty while INLEARN has no API, which is not a failure: the module
             is not published then either, so there are no course addresses to
             be missing.

             A failure is not one either. WordPress is checked in the same
             pass, and holding back a new article because Strapi happened to be
             restarting would be the wrong trade. */
          async function coursePaths() {
            const api = process.env.INLEARN_API_URL;
            if (!api) return [];

            try {
              const url = new URL("/api/inlearn/catalogue", `${api}/`);
              url.searchParams.set("locale", "en");

              const response = await fetch(url);
              if (!response.ok) throw new Error(`status ${response.status}`);

              const {courses = []} = await response.json();
              /* The slug is the address; the id is the key the data is filed
                 under. They part company the moment somebody rewrites one. */
              return courses.map((course) => `/inlearn/courses/${course.slug || course.id}/`);
            } catch (error) {
              console.log(`Could not read the INLEARN catalogue: ${error.message}. Skipping course routes.`);
              return [];
            }
          }

          const routes = [...(await articlePaths()), ...(await coursePaths())];

          let deployNeeded = false;
          for (const routePath of routes) {
            if (await isMissing(routePath)) {
              deployNeeded = true;
              break;
            }
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `deploy-needed=${deployNeeded}\n`);
          EOF

  build:
    needs: check-new-routes
    if: needs.check-new-routes.outputs.deploy-needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Guards the route/prerender and metadata contracts the deploy depends on:
      # a missing static route silently 404s in production, so catch it here.
      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # Organization/user sites are served from /; project sites are served
          # from /repository-name/. This also keeps forks and the personal Pages
          # deployment working independently.
          VITE_BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}
          VITE_CMS_ENABLED: "true"
          VITE_CMS_BASE_URL: "https://blog.innotech.global"
          VITE_CMS_HOME_ENABLED: "false"
          VITE_CMS_BLOG_ENABLED: "true"
          VITE_CMS_BLOG_PER_PAGE: "50"
          # INLEARN is published: the navbar links to it, the routes get their
          # files, and it is in the sitemap.
          #
          # Being seen and being able to sell are two different switches, and
          # only the first one is on. The API has no home yet, so anything
          # that needs the server - a price, signing in, buying - is not there
          # to be used. That is a known and accepted state, not an oversight:
          # somebody can read what is on offer and cannot yet act on it.
          #
          # The address is a repository variable rather than a line here, so
          # the day Strapi goes up the site starts using it without a commit:
          # Settings -> Secrets and variables -> Actions -> Variables ->
          # INLEARN_API_URL = https://api.innotech.global
          VITE_INLEARN_ENABLED: "true"
          VITE_INLEARN_API_URL: ${{ vars.INLEARN_API_URL }}
        run: npm run build

      - name: Add SPA fallback
        # Keeps the old cp dist/index.html dist/404.html fallback behavior,
        # and also creates 200-status static entries for known SPA routes.
        env:
          VITE_CMS_ENABLED: "true"
          VITE_CMS_BASE_URL: "https://blog.innotech.global"
          VITE_CMS_BLOG_ENABLED: "true"
          VITE_CMS_BLOG_PER_PAGE: "50"
          # This step needs both for its own reason: the flag decides whether
          # the INLEARN routes are written at all, and the address is what
          # lets it ask Strapi for the catalogue so every course gets a file
          # carrying its own title and description. With no address it falls
          # back to the copy bundled here - sixteen courses, which is what the
          # site can show until the admin panel is reachable.
          VITE_INLEARN_ENABLED: "true"
          VITE_INLEARN_API_URL: ${{ vars.INLEARN_API_URL }}
        run: node tools/scripts/generate-static-route-fallbacks.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site automatically when it has not been enabled yet.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
